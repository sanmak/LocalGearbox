sonar.projectKey=sanmak_LocalGearbox
sonar.organization=sanmak

# Source configuration
sonar.sources=app,lib,components
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Exclude test files from duplication analysis (CPD)
# Test duplication is expected and acceptable (similar describe/it patterns)
sonar.cpd.exclusions=tests/**/*

# Exclude build artifacts and dependencies
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  .claude/**,\
  dist/**,\
  coverage/**,\
  **/*.config.ts,\
  **/*.config.js

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
